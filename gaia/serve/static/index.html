<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Gaia</title>
<style>
  :root {
    --bg: #0f1216; --panel: #161b22; --panel2: #1c232c; --line: #2a3340;
    --fg: #e6edf3; --dim: #8b98a5; --accent: #7cc7a0; --warn: #e3b341;
    --err: #f2777a; --user: #2b3a4a; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f6f7f9; --panel:#fff; --panel2:#eef1f5; --line:#d8dee6; --fg:#1b2126;
            --dim:#5a6a78; --accent:#1f7a55; --user:#dfe9f3; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; grid-template-rows: auto 1fr auto; height: 100dvh;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .04em; }
  .pill { font-size: 12px; color: var(--dim); border: 1px solid var(--line);
          border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
  .pill.ok { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
  .pill.busy { color: var(--warn); }
  .pill.off { color: var(--err); }
  button.pill { background: transparent; cursor: pointer; }
  button.pill:hover { color: var(--fg); border-color: var(--accent); }
  #modelos-lista { list-style: none; margin: 0; padding: 0; max-height: 50vh; overflow-y: auto; }
  #modelos-lista li { padding: 7px 9px; border-radius: 8px; font-family: var(--mono);
                      font-size: 12.5px; cursor: pointer; }
  #modelos-lista li:hover { background: var(--panel2); }
  #modelos-lista li.atual { color: var(--accent); font-weight: bold; }
  #modelos-lista li.atual::before { content: "● "; }
  #modelos-lista li:not(.atual)::before { content: "○ "; color: var(--dim); }
  #modelos-lista p { color: var(--dim); font-size: 13px; padding: 8px 4px; }
  #status { flex: 1; color: var(--dim); font-size: 13px; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; min-height: 0; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } aside { display: none; } }
  #chat { overflow-y: auto; padding: 18px 18px 8px; display: flex; flex-direction: column; gap: 12px; }
  aside { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto;
          padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 78ch; padding: 10px 12px; border-radius: 12px; background: var(--panel);
         border: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user); }
  .msg.say { border-left: 3px solid var(--accent); }
  .msg .title { font-size: 12px; color: var(--dim); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .05em; }
  .msg code { font-family: var(--mono); font-size: 13px; background: var(--panel2); padding: 1px 5px; border-radius: 5px; }
  .msg pre { font-family: var(--mono); font-size: 13px; background: var(--panel2); padding: 8px; border-radius: 8px; overflow-x: auto; }
  .notice { font-size: 13px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line);
            color: var(--dim); align-self: flex-start; max-width: 78ch; white-space: pre-wrap; }
  .notice.warning { color: var(--warn); }
  .notice.error { color: var(--err); }
  .notice.success { color: var(--accent); }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; }
  .tool { font-size: 12px; font-family: var(--mono); padding: 3px 8px; border-radius: 999px;
          border: 1px solid var(--line); color: var(--dim); max-width: 100%; overflow: hidden;
          text-overflow: ellipsis; white-space: nowrap; }
  .tool.running { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
  .tool.ok { color: var(--accent); }
  .tool.error { color: var(--err); }
  details.reasoning { font-size: 13px; color: var(--dim); max-width: 78ch; }
  details.reasoning summary { cursor: pointer; }
  .permission { border: 1px solid var(--warn); border-radius: 12px; padding: 12px;
                background: var(--panel2); max-width: 78ch; }
  .permission .recursos { font-family: var(--mono); font-size: 12px; color: var(--dim);
                          margin: 6px 0 10px; overflow-wrap: anywhere; }
  .permission .acoes { display: flex; gap: 8px; flex-wrap: wrap; }
  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 14px; }
  .composer { display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; min-height: 44px; max-height: 40vh; padding: 10px 12px;
    border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg);
    font: inherit;
  }
  textarea:focus, input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 50%, transparent); outline-offset: 1px; }
  button {
    font: inherit; border-radius: 9px; border: 1px solid var(--line); background: var(--panel2);
    color: var(--fg); padding: 8px 14px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primario { background: var(--accent); color: #06110b; border-color: var(--accent); font-weight: 600; }
  button.perigo { color: var(--err); }
  button:disabled { opacity: .5; cursor: default; }
  .dica { font-size: 12px; color: var(--dim); }
  #busca { display: flex; gap: 8px; }
  #busca input { flex: 1; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line);
                 background: var(--bg); color: var(--fg); font: inherit; }
  #resultados { display: flex; flex-direction: column; gap: 8px; }
  .hit { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--bg);
         cursor: pointer; }
  .hit h3 { font-size: 13px; margin: 0 0 2px; }
  .hit .meta { font-size: 11px; color: var(--dim); }
  .hit p { font-size: 12px; color: var(--dim); margin: 6px 0 0; white-space: pre-wrap;
           overflow-wrap: anywhere; display: none; }
  .hit.aberto p { display: block; }
  dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--fg);
           padding: 20px; max-width: 420px; width: calc(100% - 40px); }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h2 { margin: 0 0 6px; font-size: 16px; }
  dialog p { color: var(--dim); font-size: 13px; margin: 0 0 12px; }
  dialog input { width: 100%; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--line);
                 background: var(--bg); color: var(--fg); font: var(--mono); margin-bottom: 12px; }
  .linha { display: flex; gap: 8px; justify-content: flex-end; }
</style>
</head>
<body>
<header>
  <h1>gaia</h1>
  <span id="conexao" class="pill off">desconectada</span>
  <button id="modelo" class="pill" type="button" hidden title="trocar o modelo"></button>
  <span id="status"></span>
  <button id="abortar" class="perigo" title="encerra o turno atual" disabled>parar</button>
  <button id="trocar-token" title="trocar o token">token</button>
</header>

<main>
  <section id="chat" aria-live="polite"></section>
  <aside>
    <div id="busca">
      <input id="q" type="search" placeholder="buscar no Second Brain" autocomplete="off">
    </div>
    <div id="resultados"><p class="dica">A busca abre o trecho exato da nota.</p></div>
    <p class="dica" id="notas"></p>
  </aside>
</main>

<footer>
  <div class="composer">
    <textarea id="entrada" rows="1" placeholder="Escreva para a Gaia…  (Enter envia, Shift+Enter quebra linha)"></textarea>
    <button id="enviar" class="primario">enviar</button>
  </div>
</footer>

<dialog id="login">
  <form method="dialog">
    <h2>Token do servidor</h2>
    <p>É o <code>GAIA_SERVE_TOKEN</code> do mini. Fica só no armazenamento deste navegador e vai no cabeçalho, nunca na URL.</p>
    <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="cole o token aqui">
    <div class="linha">
      <button value="cancelar" formnovalidate>agora não</button>
      <button id="conectar" value="ok" class="primario">conectar</button>
    </div>
  </form>
</dialog>

<dialog id="modelos">
  <form method="dialog">
    <h2>Escolha o modelo</h2>
    <p>Vale a partir do próximo turno e fica salvo no servidor.</p>
    <ul id="modelos-lista"><li>consultando…</li></ul>
    <div class="linha"><button value="cancelar" formnovalidate>fechar</button></div>
  </form>
</dialog>

<script>
"use strict";
const $ = (sel) => document.querySelector(sel);
const chat = $("#chat");
const entrada = $("#entrada");
const conexao = $("#conexao");
const estado = {
  token: localStorage.getItem("gaia.token") || "",
  ultimoSeq: 0,
  fluxo: null,      // elemento do stream em andamento
  raciocinio: null, // <details> do raciocínio em andamento
  ferramentas: [],  // chips "running" deste turno
  respondeu: false, // texto final deste turno ja foi desenhado
};

function cabecalhos() {
  const h = { "Content-Type": "application/json" };
  if (estado.token) h.Authorization = "Bearer " + estado.token;
  return h;
}

function texto(valor) {
  return String(valor ?? "");
}

// Markdown mínimo e seguro: escapa tudo e depois reabilita três marcas.
function md(bruto) {
  const escapado = texto(bruto)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return escapado
    .replace(/```([\s\S]*?)```/g, (_, c) => "<pre>" + c.replace(/^\n/, "") + "</pre>")
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
}

function rolar() { chat.scrollTop = chat.scrollHeight; }

function aviso(nivel, conteudo) {
  const div = document.createElement("div");
  div.className = "notice" + (nivel ? " " + nivel : "");
  div.textContent = texto(conteudo);
  chat.append(div); rolar();
  return div;
}

function bolha(classe, conteudo, titulo) {
  const div = document.createElement("div");
  div.className = "msg " + classe;
  if (titulo) {
    const t = document.createElement("div");
    t.className = "title"; t.textContent = titulo; div.append(t);
  }
  const corpo = document.createElement("div");
  corpo.innerHTML = md(conteudo);
  div.append(corpo);
  chat.append(div); rolar();
  return div;
}

function marcarConexao(texto, classe) {
  conexao.textContent = texto;
  conexao.className = "pill " + classe;
}

async function conectar() {
  if (!estado.token) { pedirToken(); return; }
  while (true) {
    try {
      marcarConexao("conectando…", "");
      const resposta = await fetch(`/events?since=${estado.ultimoSeq}`, { headers: cabecalhos() });
      if (resposta.status === 401) {
        marcarConexao("token recusado", "off");
        pedirToken("O token foi recusado pelo servidor.");
        return;
      }
      if (!resposta.ok || !resposta.body) throw new Error("HTTP " + resposta.status);
      marcarConexao("conectada", "ok");
      const leitor = resposta.body.getReader();
      const decodificador = new TextDecoder();
      let buffer = "";
      while (true) {
        const { value, done } = await leitor.read();
        if (done) throw new Error("stream encerrado");
        buffer += decodificador.decode(value, { stream: true });
        let corte;
        while ((corte = buffer.indexOf("\n\n")) >= 0) {
          const bloco = buffer.slice(0, corte);
          buffer = buffer.slice(corte + 2);
          tratarBloco(bloco);
        }
      }
    } catch (erro) {
      marcarConexao("reconectando…", "busy");
      await new Promise((r) => setTimeout(r, 1500));
    }
  }
}

function tratarBloco(bloco) {
  const dados = bloco.split("\n").filter((l) => l.startsWith("data:")).map((l) => l.slice(5).trim()).join("");
  if (!dados) return; // ": keep-alive"
  let evento;
  try { evento = JSON.parse(dados); } catch { return; }
  if (evento.seq) estado.ultimoSeq = Math.max(estado.ultimoSeq, evento.seq);
  tratarEvento(evento);
}

// Fecha o turno. O texto final chega em `run_finished` (e as vezes em
// `stream_end`); quando nao ha texto, a bolha vazia nao fica no historico.
function finalizar(textoFinal) {
  const final = texto(textoFinal);
  if (estado.fluxo) {
    const corpo = estado.fluxo.querySelector("div:last-child");
    const tinha = !!(corpo && corpo.textContent.trim());
    if (final) {
      corpo.innerHTML = md(final);
      estado.respondeu = true;
    } else if (!tinha) {
      estado.fluxo.remove();
    } else {
      estado.respondeu = true;
    }
    estado.fluxo = null;
  } else if (final && !estado.respondeu) {
    bolha("say", final, "gaia");
    estado.respondeu = true;
  }
  estado.raciocinio = null;
  for (const chip of estado.ferramentas) chip.classList.replace("running", "ok");
  estado.ferramentas = [];
}

function tratarEvento(evento) {
  switch (evento.type) {
    case "run_started":
      estado.respondeu = false;
      $("#abortar").disabled = false;
      break;
    case "user":
      bolha("user", evento.text, "você");
      break;
    case "say":
      bolha("say", evento.text, evento.title || "gaia");
      break;
    case "proactive":
      bolha("say", evento.text, "gaia · proativo");
      break;
    case "stream_begin":
      estado.fluxo = bolha("say", "", "gaia");
      break;
    case "stream_delta": {
      if (!estado.fluxo) estado.fluxo = bolha("say", "", "gaia");
      const corpo = estado.fluxo.querySelector("div:last-child");
      corpo.textContent += texto(evento.text);
      rolar();
      break;
    }
    case "stream_end":
      finalizar(evento.text);
      break;
    case "reasoning": {
      if (!estado.raciocinio) {
        estado.raciocinio = document.createElement("details");
        estado.raciocinio.className = "reasoning";
        const resumo = document.createElement("summary");
        resumo.textContent = "raciocínio";
        estado.raciocinio.append(resumo, document.createElement("div"));
        chat.append(estado.raciocinio);
      }
      estado.raciocinio.lastElementChild.textContent += texto(evento.text);
      rolar();
      break;
    }
    case "tool": {
      const chip = document.createElement("span");
      chip.className = "tool " + (evento.status || "running");
      chip.textContent = texto(evento.name) + (evento.detail ? " · " + evento.detail : "");
      chip.title = chip.textContent;
      let linha = chat.lastElementChild;
      if (!linha || !linha.classList.contains("tools")) {
        linha = document.createElement("div"); linha.className = "tools"; chat.append(linha);
      }
      linha.append(chip);
      if ((evento.status || "running") === "running") estado.ferramentas.push(chip);
      if (evento.diff) bolha("say", "```\n" + evento.diff + "\n```", "diff " + texto(evento.name));
      rolar();
      break;
    }
    case "permission":
      cartaoPermissao(evento);
      break;
    case "permission_timeout":
      aviso("warning", "a permissão expirou no servidor; a ação foi negada.");
      break;
    case "notice":
      aviso(evento.level, evento.text);
      break;
    case "status":
      $("#status").textContent = texto(evento.text) + (evento.detail ? " · " + evento.detail : "");
      break;
    case "tokens":
      if (evento.text) $("#status").textContent = texto(evento.text);
      break;
    case "session":
    case "banner":
      if (evento.model) {
        $("#modelo").hidden = false;
        $("#modelo").textContent = texto(evento.model);
      }
      if (evento.notes !== undefined) $("#notas").textContent = texto(evento.notes) + " notas no Second Brain";
      break;
    case "search_results":
      mostrarHits(evento.hits);
      break;
    case "context_hits": {
      const hits = Array.isArray(evento.hits) ? evento.hits : [];
      if (hits.length) aviso("", "memória: " + hits.length + " trecho(s) do Second Brain entraram no contexto");
      break;
    }
    case "run_finished":
      // Deltas podem nao existir (provedor sem stream): o texto final
      // chega aqui, e nao no stream_end, que so fecha o bloco.
      finalizar(evento.text);
      $("#abortar").disabled = true;
      $("#status").textContent = "";
      if (evento.ok === false) aviso("error", "o turno falhou: " + texto(evento.error));
      break;
    case "aborted":
      finalizar("");
      $("#abortar").disabled = true;
      aviso("warning", "turno interrompido.");
      break;
    case "closed":
      marcarConexao("servidor encerrou", "off");
      break;
  }
}

function cartaoPermissao(evento) {
  const cartao = document.createElement("div");
  cartao.className = "permission";
  const titulo = document.createElement("strong");
  titulo.textContent = "permissão necessária: " + texto(evento.tool);
  const recursos = document.createElement("div");
  recursos.className = "recursos";
  recursos.textContent = (evento.resources || []).join("  ·  ");
  const acoes = document.createElement("div");
  acoes.className = "acoes";
  const decidir = async (decisao) => {
    acoes.querySelectorAll("button").forEach((b) => (b.disabled = true));
    try {
      const r = await fetch("/permission/" + encodeURIComponent(texto(evento.request_id)), {
        method: "POST", headers: cabecalhos(), body: JSON.stringify({ decision: decisao }),
      });
      if (!r.ok) throw new Error("HTTP " + r.status);
      cartao.remove();
      aviso(decisao === "reject" ? "warning" : "success",
            decisao === "reject" ? "ação recusada." : "ação liberada (" + decisao + ").");
    } catch (erro) {
      aviso("error", "não consegui responder a permissão: " + erro.message);
      acoes.querySelectorAll("button").forEach((b) => (b.disabled = false));
    }
  };
  for (const [rotulo, decisao, classe] of [
    ["uma vez", "once", "primario"], ["sempre", "always", ""], ["recusar", "reject", "perigo"],
  ]) {
    const botao = document.createElement("button");
    botao.textContent = rotulo; botao.className = classe;
    botao.addEventListener("click", () => decidir(decisao));
    acoes.append(botao);
  }
  cartao.append(titulo, recursos, acoes);
  chat.append(cartao); rolar();
}

async function enviar() {
  const conteudo = entrada.value.trim();
  if (!conteudo) return;
  if (!estado.token) { pedirToken(); return; }
  entrada.value = ""; entrada.style.height = "auto";
  bolha("user", conteudo, "você");
  try {
    const r = await fetch("/turn", { method: "POST", headers: cabecalhos(), body: JSON.stringify({ text: conteudo }) });
    if (r.status === 401) { pedirToken("O token foi recusado pelo servidor."); return; }
    if (r.status === 409) { aviso("warning", "a Gaia ainda está no turno anterior."); return; }
    if (!r.ok) aviso("error", "não consegui enviar (HTTP " + r.status + ").");
  } catch (erro) {
    aviso("error", "sem conexão com o servidor: " + erro.message);
  }
}

async function buscar() {
  const q = $("#q").value.trim();
  const resultados = $("#resultados");
  if (!q) { resultados.innerHTML = '<p class="dica">A busca abre o trecho exato da nota.</p>'; return; }
  try {
    const r = await fetch("/search?q=" + encodeURIComponent(q), { headers: cabecalhos() });
    if (r.status === 401) { pedirToken("O token foi recusado pelo servidor."); return; }
    const dados = await r.json();
    mostrarHits(dados.hits, q);
  } catch (erro) {
    resultados.innerHTML = "";
    const p = document.createElement("p"); p.className = "dica";
    p.textContent = "busca falhou: " + erro.message;
    resultados.append(p);
  }
}

function mostrarHits(hits, consulta) {
  const resultados = $("#resultados");
  resultados.innerHTML = "";
  if (!Array.isArray(hits) || !hits.length) {
    const p = document.createElement("p"); p.className = "dica";
    p.textContent = consulta ? "nada encontrado para “" + consulta + "”." : "nada encontrado.";
    resultados.append(p);
    return;
  }
  for (const hit of hits) {
    const item = document.createElement("article");
    item.className = "hit";
    const titulo = document.createElement("h3");
    titulo.textContent = texto(hit.title) || "(sem título)";
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = [texto(hit.section), texto(hit.rel_path)].filter(Boolean).join(" · ");
    const trecho = document.createElement("p");
    trecho.textContent = texto(hit.snippet);
    item.append(titulo, meta, trecho);
    item.addEventListener("click", () => item.classList.toggle("aberto"));
    resultados.append(item);
  }
}

function pedirToken(mensagem) {
  const dialogo = $("#login");
  if (mensagem) dialogo.querySelector("p").textContent = mensagem;
  $("#token").value = estado.token;
  if (!dialogo.open) dialogo.showModal();
}

$("#login").addEventListener("close", () => {
  const valor = $("#token").value.trim();
  if ($("#login").returnValue !== "ok") return;
  if (!valor) return;
  estado.token = valor;
  localStorage.setItem("gaia.token", valor);
  estado.ultimoSeq = 0;
  conectar();
});

async function abrirModelos() {
  const dialogo = $("#modelos");
  const lista = $("#modelos-lista");
  lista.innerHTML = "<li>consultando…</li>";
  dialogo.showModal();
  try {
    const r = await fetch("/models", { headers: cabecalhos() });
    if (r.status === 401) { dialogo.close(); pedirToken("O token foi recusado pelo servidor."); return; }
    if (!r.ok) throw new Error("HTTP " + r.status);
    const dados = await r.json();
    const modelos = Array.isArray(dados.models) ? dados.models : [];
    lista.innerHTML = "";
    if (!modelos.length) {
      const p = document.createElement("p");
      p.textContent = "nenhum modelo disponível; confira as chaves no servidor.";
      lista.append(p);
      return;
    }
    for (const item of modelos) {
      const li = document.createElement("li");
      li.textContent = texto(item.slug);
      if (item.current) li.className = "atual";
      li.addEventListener("click", () => escolherModelo(item.slug));
      lista.append(li);
    }
  } catch (erro) {
    lista.innerHTML = "";
    const p = document.createElement("p");
    p.textContent = "não consegui listar: " + erro.message;
    lista.append(p);
  }
}

async function escolherModelo(slug) {
  $("#modelos").close();
  try {
    const r = await fetch("/model", {
      method: "POST", headers: cabecalhos(), body: JSON.stringify({ model: slug }),
    });
    if (r.status === 401) { pedirToken("O token foi recusado pelo servidor."); return; }
    if (r.status === 409) { aviso("warning", "a Gaia está no meio de um turno; tente de novo quando terminar."); return; }
    const dados = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(dados.message || "HTTP " + r.status);
    $("#modelo").hidden = false;
    $("#modelo").textContent = texto(slug);
    aviso("success", "modelo agora: " + slug);
  } catch (erro) {
    aviso("error", "não consegui trocar o modelo: " + erro.message);
  }
}

$("#modelo").addEventListener("click", abrirModelos);
$("#trocar-token").addEventListener("click", () => pedirToken());
$("#enviar").addEventListener("click", enviar);
$("#abortar").addEventListener("click", async () => {
  try { await fetch("/abort", { method: "POST", headers: cabecalhos() }); }
  catch (erro) { aviso("error", "não consegui parar: " + erro.message); }
});
entrada.addEventListener("keydown", (evento) => {
  if (evento.key === "Enter" && !evento.shiftKey) { evento.preventDefault(); enviar(); }
});
entrada.addEventListener("input", () => {
  entrada.style.height = "auto";
  entrada.style.height = Math.min(entrada.scrollHeight, window.innerHeight * 0.4) + "px";
});

let espera;
$("#q").addEventListener("input", () => {
  clearTimeout(espera);
  espera = setTimeout(buscar, 300);
});

if (!estado.token) pedirToken("Conecte com o token do gaia serve no mini.");
conectar();
</script>
</body>
</html>
