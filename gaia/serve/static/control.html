<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Gaia — Control Center</title>
<link rel="stylesheet" href="/control/static/control.css">
</head>
<body>
<header>
  <h1>Control Center</h1>
  <span id="pill-status" class="pill">aguardando</span>
  <span id="pill-model" class="pill mono">—</span>
  <span id="status">informe o token para carregar</span>
  <button id="btn-token" class="pill" type="button">token</button>
  <button id="btn-refresh" class="pill" type="button">atualizar</button>
</header>

<nav id="abas">
  <button data-tab="overview" class="active" type="button">Overview</button>
  <button data-tab="models" type="button">Models &amp; Providers</button>
  <button data-tab="skills" type="button">Skills</button>
  <button data-tab="automations" type="button">Automations</button>
  <button data-tab="activity" type="button">Activity</button>
  <button data-tab="errors" type="button">Error Center</button>
  <button data-tab="settings" type="button">System Settings</button>
</nav>

<main>
  <section id="tab-overview" class="tab active"></section>
  <section id="tab-models" class="tab"></section>
  <section id="tab-skills" class="tab"></section>
  <section id="tab-automations" class="tab"></section>
  <section id="tab-activity" class="tab"></section>
  <section id="tab-errors" class="tab"></section>
  <section id="tab-settings" class="tab"></section>
</main>

<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <h2>Token do Control Center</h2>
    <p class="dim">
      É o valor de <code>GAIA_CONTROL_TOKEN</code> no <code>~/.config/gaia/.env</code>.
      Fica só neste navegador (<code>localStorage</code>) e vai no cabeçalho
      <code>Authorization</code> — nunca na URL.
    </p>
    <input id="input-token" type="password" placeholder="cole o token" autocomplete="off">
    <div class="modal-actions">
      <button id="btn-save-token" type="button" class="primary">salvar</button>
      <button id="btn-clear-token" type="button">esquecer</button>
      <button id="btn-close-modal" type="button">fechar</button>
    </div>
  </div>
</div>

<script src="/control/static/control.js"></script>
</body>
</html>
